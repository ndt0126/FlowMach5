[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mach5"
version = "0.1.0"
description = "Private, resumable one-way directory transfer"
requires-python = ">=3.11"
dependencies = [
  "certifi>=2025.1.31",
  "cryptography>=44,<47",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "websockets>=13,<17",
]

[project.scripts]
mach5-client = "mach5.client.app:main"
mach5-server = "mach5.server.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
